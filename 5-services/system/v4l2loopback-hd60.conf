# Named to load after Omarchy's v4l2loopback-exclusive-caps.conf so these
# per-device settings win. HD60 S+ Shared has to stay non-exclusive (0), or
# OBS gets RGB instead of NV12 from it and refuses to open it.
options v4l2loopback devices=2 video_nr=10,11 card_label="HD60 S+ Shared","OBS Virtual Camera" exclusive_caps=0,1
