# My overrides for Omarchy's Cam Link relay (camlink.conf next to this file).
# The kyle.conf drop-in loads this after Omarchy's, so these values win.
#
# Omarchy feeds the Cam Link straight into a 1280x720 30fps NV12 sink with
# nothing in between, which never matches what my A6000 sends (1920x1080 at
# 59.94 in I420), so the relay gave up on every open. Convert, scale and
# retime instead, and relay the full 1080p60 so OBS can share this camera.
#
# I420 rather than NV12: OBS opens cameras through libv4l2, which turns NV12
# into RGB on a capture-only device, and OBS rejects RGB.
VIDEOSRC="v4l2src device=/dev/camlink4k ! videoconvert ! videoscale ! videorate"
FORMAT=I420
WIDTH=1920
HEIGHT=1080
FRAMERATE=60000/1001
