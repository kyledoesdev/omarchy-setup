# Create the Cam Link virtual camera at a fixed /dev/video12 so OBS finds it
# after every reboot. Omarchy's version takes whatever number is free.
[Service]
ExecStart=
ExecStart=/usr/bin/modprobe v4l2loopback
ExecStart=/bin/sh -c 'grep -qsx "Cam Link 4K" /sys/devices/virtual/video4linux/*/name || exec v4l2loopback-ctl add -n "Cam Link 4K" -x 1 /dev/video12'
