<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream Chat Overlay</title>
<!--
  OBS browser source. Twitch + YouTube chat with a platform icon on each line.
  URL options (all optional):
    ?platforms=twitch          Twitch only (or youtube, or twitch,youtube)
    &fade=30                   hide each message after 30 seconds (default 120, 0 = never)
    &max=40                    messages kept on screen
    &size=24                   font size in px
    &font=Fredoka%20One        any Google Font name
    &bg=1                      dark box behind each message
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap">
<style>
  :root {
    --size: 24px;
    --font: "Fredoka One", "Nunito", system-ui, sans-serif;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #chat {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 6px;
    padding: 0 6px 6px;
    font-family: var(--font);
    font-size: var(--size);
    line-height: 1.3;
    color: #fff;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 1px 1px 2px #000;
    overflow: hidden;
  }
  .msg {
    animation: in 220ms ease-out;
    overflow-wrap: anywhere;
    transition: opacity 600ms;
  }
  .msg.gone { opacity: 0; }
  body.bg .msg {
    background: rgba(10, 10, 14, 0.62);
    border-radius: 10px;
    padding: 4px 10px;
  }
  @keyframes in {
    from { opacity: 0; transform: translateX(24px); }
    to { opacity: 1; transform: none; }
  }
  .meta { white-space: nowrap; }
  .pf, .badge {
    display: inline-block;
    width: 1em;
    height: 1em;
    vertical-align: -0.14em;
    margin-right: 0.22em;
    filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.8));
  }
  .pf { width: 1.05em; height: 1.05em; margin-right: 0.3em; }
  .pf svg, .badge svg { width: 100%; height: 100%; display: block; }
  img.badge { object-fit: contain; }
  .emote {
    height: 1.5em;
    vertical-align: middle;
    margin: -0.25em 0.05em;
  }
  .emote.sticker { height: 3.2em; margin: 0.1em 0; }
  img.emoji { height: 1.1em; width: 1.1em; vertical-align: -0.2em; margin: 0 0.05em; }
  .action .body { font-style: italic; }
  .kind-superchat, .kind-member, .kind-highlight {
    background: color-mix(in srgb, var(--card, #2BA640) 70%, transparent);
    border-radius: 10px;
    padding: 4px 10px 6px;
  }
  .kind-highlight { --card: #755ebc; }
  .kind-superchat .name, .kind-member .name, .kind-highlight .name { color: #fff !important; }
  .msg-head {
    font-size: 0.8em;
    display: flex;
    gap: 0.5em;
    align-items: baseline;
    margin-bottom: 2px;
  }
  .msg-head .amount { font-size: 1.1em; }
</style>
</head>
<body>
<div id="chat"></div>
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script type="module">
  import { connect, renderMessage, applyRemoval } from './client.js';

  const q = new URLSearchParams(location.search);
  const platforms = new Set((q.get('platforms') || 'twitch,youtube').split(',').map((s) => s.trim().toLowerCase()));
  const fade = Number(q.get('fade') ?? 120);
  const max = Number(q.get('max') || 40);
  if (q.get('size')) document.documentElement.style.setProperty('--size', `${Number(q.get('size'))}px`);
  if (q.get('font')) {
    const f = q.get('font');
    document.getElementById('font').href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(f)}&display=swap`;
    document.documentElement.style.setProperty('--font', `"${f.replace(/"/g, '')}", system-ui, sans-serif`);
  }
  if (q.get('bg') === '1') document.body.classList.add('bg');

  const chat = document.getElementById('chat');

  function add(m) {
    if (!platforms.has(m.platform)) return;
    // Time left on screen, counted from when the message was sent, so lines
    // brought back after a refresh still go away on schedule.
    const left = fade > 0 ? fade * 1000 - Math.max(0, Date.now() - (m.ts || Date.now())) : Infinity;
    if (left <= 0) return;
    const row = renderMessage(m);
    if (window.twemoji) {
      try {
        twemoji.parse(row, { folder: 'svg', ext: '.svg', base: 'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/' });
      } catch {}
    }
    chat.append(row);
    while (chat.children.length > max) chat.firstElementChild.remove();
    if (left !== Infinity) {
      setTimeout(() => {
        row.classList.add('gone');
        setTimeout(() => row.remove(), 700);
      }, left);
    }
  }

  connect({
    // On (re)connect only keep a few recent lines so a refreshed source
    // doesn't flood the screen. With fading on, add() drops any that are
    // already past their time.
    hello: (d) => {
      chat.replaceChildren();
      d.history.filter((m) => Date.now() - m.ts < 10 * 60 * 1000).slice(-8).forEach(add);
    },
    msg: add,
    delete: (d) => applyRemoval(chat, 'delete', d),
    'clear-user': (d) => applyRemoval(chat, 'clear-user', d),
    'clear-all': (d) => applyRemoval(chat, 'clear-all', d),
  });
</script>
</body>
</html>
