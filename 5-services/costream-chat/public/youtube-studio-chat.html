<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube chat</title>
<!--
  The YouTube chat window in Streaming mode (Super+3). YouTube gives every
  stream a new video ID, so this page waits until the service sees the
  current stream, then turns into YouTube Studio's popout chat for it
  (full mod tools, signed in through Brave).
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0f0f0f; color: #f1f1f1; font: 14px/1.5 Roboto, Inter, system-ui, sans-serif; }
  .wrap { box-sizing: border-box; height: 100%; padding: 0 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  svg { width: 44px; height: 44px; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; animation: pulse 1.6s infinite; }
  body.down .dot { background: #ff8280; animation: none; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  p { margin: 0; max-width: 280px; color: #aaa; }
  a { color: #3ea6ff; }
</style>
</head>
<body>
<div class="wrap">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF0000" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8z"/><path fill="#fff" d="M9.6 15.6 15.8 12 9.6 8.4z"/></svg>
  <h1><span class="dot"></span><span id="state">Waiting for the YouTube stream</span></h1>
  <p id="note">This turns into YouTube Studio's live chat as soon as your YouTube stream starts.</p>
  <p><a href="/open/youtube-chat">Open YouTube Studio instead</a></p>
</div>
<script type="module">
  import { connect } from './client.js';

  function follow(s) {
    const id = s?.youtube?.videoId;
    if (id && /^[\w-]{11}$/.test(id)) location.replace(`https://studio.youtube.com/live_chat?is_popout=1&v=${id}`);
  }

  connect({
    hello: (d) => {
      document.body.classList.remove('down');
      document.getElementById('state').textContent = 'Waiting for the YouTube stream';
      follow(d.status);
    },
    status: follow,
    down: () => {
      document.body.classList.add('down');
      document.getElementById('state').textContent = 'Co-stream service not reachable';
    },
  });
</script>
</body>
</html>
