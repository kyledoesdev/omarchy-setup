<?xml version="1.0" encoding="UTF-8"?>
<!-- Files (Nautilus) icon for the Omarchy dock, in Nord colors. Kept to plain
     paths, rects and linear gradients so Qt's SVG renderer draws it exactly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E81AC"/>
      <stop offset="1" stop-color="#3B4F73"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#9AD6E4"/>
      <stop offset="0.55" stop-color="#81A1C1"/>
      <stop offset="1" stop-color="#5E81AC"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8DEE9"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3440" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2E3440" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M26 66 Q26 46 46 46 H96 Q106 46 113 53 L125 65 H210 Q230 65 230 85 V194 Q230 214 210 214 H46 Q26 214 26 194 Z" fill="url(#back)"/>
  <rect x="50" y="74" width="150" height="104" rx="9" fill="url(#paper)" transform="rotate(-5 125 126)"/>
  <rect x="62" y="82" width="142" height="100" rx="9" fill="#ECEFF4" transform="rotate(4 133 132)"/>
  <rect x="70" y="102" width="70" height="7" rx="3.5" fill="#B48EAD" transform="rotate(4 133 132)"/>
  <rect x="70" y="118" width="110" height="6" rx="3" fill="#C9D1DD" transform="rotate(4 133 132)"/>
  <path d="M22 112 Q22 98 36 98 H220 Q234 98 234 112 L228 196 Q227 216 207 216 H49 Q29 216 28 196 Z" fill="url(#front)"/>
  <path d="M22 112 Q22 98 36 98 H220 Q234 98 234 112 L233.4 120 H22.6 Z" fill="url(#shade)" opacity="0.5"/>
  <path d="M38 105 H218" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  <path d="M112 166 H144" stroke="#2E3440" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round"/>
</svg>
